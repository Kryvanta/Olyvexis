<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Olyvexis</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #07090e;
      --glass: rgba(16, 20, 30, 0.84);
      --border: rgba(255, 255, 255, 0.14);
      --accent: #3b82f6;
      --accent-bright: #60a5fa;
      --text: #f3f6fc;
      --muted: #9ea9bf;
      --success: #22c55e;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      overflow: hidden; user-select: none;
    }
    canvas, video { display: block; width: 100vw; height: 100vh; object-fit: contain; background: #000; }
    video { display: none; }
    #kbd { position: fixed; left: -1000px; top: 0; width: 10px; height: 10px; opacity: 0; }

    /* Floating glassmorphic HUD */
    #hud {
      position: fixed; top: 12px; right: 12px; z-index: 20;
      display: flex; align-items: center; gap: 10px;
      padding: 6px 8px 6px 12px;
      border-radius: 999px;
      background: var(--glass);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      font-size: 12px; color: var(--muted);
      transition: opacity 0.25s ease, transform 0.2s ease;
      opacity: 0.72;
    }
    #hud:hover { opacity: 1; }
    #hud.collapsed #metrics, #hud.collapsed .hud-extra { display: none; }
    :fullscreen #hud { display: none; }

    .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted); flex-shrink: 0;
    }
    .dot.ok { background: var(--success); box-shadow: 0 0 8px rgba(34, 197, 94, 0.7); }
    .dot.err { background: var(--danger); }

    #metrics {
      white-space: nowrap; font-variant-numeric: tabular-nums;
      color: var(--text); font-weight: 500;
    }
    .hud-btn {
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text); font-size: 12px; font-weight: 500;
      padding: 5px 11px; border-radius: 999px; cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .hud-btn:hover { background: rgba(59, 130, 246, 0.35); border-color: rgba(96, 165, 250, 0.6); }

    /* Empty screen notice */
    #emptyHint {
      position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
      display: none; text-align: center; padding: 18px 24px; border-radius: 16px;
      background: var(--glass); border: 1px solid var(--border);
      backdrop-filter: blur(16px); color: var(--text); font-size: 14px;
      pointer-events: none;
    }

    /* PIN Lock Screen */
    #pin {
      position: fixed; inset: 0; z-index: 30; display: none;
      align-items: center; justify-content: center;
      background: radial-gradient(circle at 50% 25%, #162447 0%, #07090e 65%);
      padding: 20px;
    }
    .pin-card {
      width: 100%; max-width: 360px;
      background: var(--glass);
      backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
      display: flex; flex-direction: column; align-items: center; gap: 16px;
      text-align: center;
    }
    .logo-badge {
      width: 54px; height: 54px; border-radius: 16px;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      display: grid; place-items: center;
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.35);
    }
    .pin-title { font-size: 20px; font-weight: 700; letter-spacing: -0.3px; }
    .pin-sub { font-size: 13px; color: var(--muted); line-height: 1.45; }
    #pinError { font-size: 12px; color: #fca5a5; min-height: 16px; }
    #pin form { width: 100%; display: flex; flex-direction: column; gap: 14px; align-items: center; }
    #pin input {
      width: 100%; font-size: 30px; font-weight: 700; text-align: center;
      letter-spacing: 0.38em; padding: 12px 14px; border-radius: 14px;
      border: 1px solid var(--border); background: rgba(0, 0, 0, 0.35); color: #fff;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      outline: none; transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    #pin input:focus {
      border-color: var(--accent-bright);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.25);
    }
    #pin button {
      width: 100%; font-size: 15px; font-weight: 600; padding: 12px 20px;
      border-radius: 14px; border: 0; cursor: pointer;
      background: linear-gradient(90deg, #3b82f6, #2563eb); color: #fff;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
    }
    #pin button:hover { filter: brightness(1.08); }
  </style>
</head>
<body>
  <canvas id="screen"></canvas>
  <video id="video" muted autoplay playsinline disablepictureinpicture></video>

  <div id="hud">
    <span id="dot" class="dot"></span>
    <span id="metrics">Connecting…</span>
    <button id="httpsBtn" class="hud-btn hud-extra" style="display:none">Enable HTTPS</button>
    <button id="fitBtn" class="hud-btn hud-extra">Fit Window</button>
    <button id="fs" class="hud-btn hud-extra">Fullscreen</button>
    <button id="toggleHud" class="hud-btn">▾</button>
  </div>

  <div id="emptyHint">Connected. Open an app on your phone or from the taskbar.</div>
  <textarea id="kbd" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea>

  <div id="pin">
    <div class="pin-card">
      <div class="logo-badge">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
      </div>
      <div>
        <div class="pin-title">Olyvexis</div>
        <div id="pinSub" class="pin-sub">Enter the 4-digit PIN shown on your phone to connect.</div>
      </div>
      <form>
        <input name="pin" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="••••" autofocus>
        <div id="pinError"></div>
        <button id="pinSubmit" type="submit">Connect Desktop</button>
      </form>
    </div>
  </div>

  <script src="mse.js"></script>
  <script>
    const IS_VI = (navigator.language || '').toLowerCase().startsWith('vi');
    const T = IS_VI ? {
      connecting: 'Đang kết nối…',
      connectedWait: 'Đã kết nối, chờ hình…',
      wrongPin: 'Mã PIN không đúng, vui lòng thử lại.',
      reconnecting: code => `Mất kết nối (${code}). Đang kết nối lại…`,
      noDecoder: 'Trình duyệt không hỗ trợ WebCodecs hoặc MSE.',
      httpsBtn: 'Bật HTTPS',
      fitBtn: 'Khớp cửa sổ',
      fsBtn: 'Toàn màn hình',
      emptyHint: 'Đã kết nối. Hãy mở một ứng dụng trên điện thoại hoặc từ thanh tác vụ.',
      pinSub: 'Nhập mã PIN gồm 4 chữ số đang hiển thị trên điện thoại để kết nối.',
      pinSubmit: 'Kết nối Desktop',
    } : {
      connecting: 'Connecting…',
      connectedWait: 'Connected, waiting for video…',
      wrongPin: 'Incorrect PIN, please try again.',
      reconnecting: code => `Disconnected (${code}). Reconnecting…`,
      noDecoder: 'This browser does not support WebCodecs or MSE.',
      httpsBtn: 'Enable HTTPS',
      fitBtn: 'Fit Window',
      fsBtn: 'Fullscreen',
      emptyHint: 'Connected. Open an app on your phone or from the taskbar.',
      pinSub: 'Enter the 4-digit PIN shown on your phone to connect.',
      pinSubmit: 'Connect Desktop',
    };

    document.documentElement.lang = IS_VI ? 'vi' : 'en';
    document.getElementById('httpsBtn').textContent = T.httpsBtn;
    document.getElementById('fitBtn').textContent = T.fitBtn;
    document.getElementById('fs').textContent = T.fsBtn;
    document.getElementById('emptyHint').textContent = T.emptyHint;
    document.getElementById('pinSub').textContent = T.pinSub;
    document.getElementById('pinSubmit').textContent = T.pinSubmit;
    document.getElementById('metrics').textContent = T.connecting;

    const canvas = document.getElementById('screen');
    const ctx = canvas.getContext('2d');
    const metricsEl = document.getElementById('metrics');
    const dotEl = document.getElementById('dot');
    const hudEl = document.getElementById('hud');
    const emptyHintEl = document.getElementById('emptyHint');
    const pinBox = document.getElementById('pin');
    const pinErrorEl = document.getElementById('pinError');

    const FLAG_KEY = 2;
    const CLOSE_WRONG_PIN = 4001;

    let ws = null;
    let decoder = null;
    let pendingFrame = null;
    let screenInfo = null;
    let frames = 0, fps = 0, bytes = 0, kbps = 0, dropped = 0, rttMs = null;
    let lastError = '';

    function setStatus(text, ok = null) {
      metricsEl.textContent = text;
      dotEl.className = 'dot' + (ok === true ? ' ok' : ok === false ? ' err' : '');
    }

    function renderStatus() {
      const size = screenInfo ? `${screenInfo.width}×${screenInfo.height}` : '?';
      const rate = kbps >= 1000 ? `${(kbps / 1000).toFixed(1)} Mbps` : `${kbps} kbps`;
      const pingText = rttMs !== null ? ` · ${rttMs} ms` : '';
      const errText = lastError ? ` · ${lastError}` : '';
      setStatus(`${size} · ${MODE.toUpperCase()} · ${fps} fps · ${rate}${pingText}${errText}`, true);
    }

    setInterval(() => {
      fps = frames; frames = 0;
      kbps = Math.round(bytes * 8 / 1000); bytes = 0;
      if (ws && ws.readyState === WebSocket.OPEN) {
        renderStatus();
        ws.send(JSON.stringify({ t: 'ping', ts: Date.now() }));
      }
    }, 1000);

    const video = document.getElementById('video');
    const forcedMode = new URLSearchParams(location.search).get('mode');
    const MODE = forcedMode === 'mse' && MsePlayer.supported() ? 'mse'
      : 'VideoDecoder' in window ? 'webcodecs' : (MsePlayer.supported() ? 'mse' : null);
    let mse = null;
    if (!MODE) {
      setStatus(T.noDecoder, false);
      throw new Error('no decoder');
    }
    if (MODE === 'mse') {
      canvas.style.display = 'none';
      video.style.display = 'block';
      if ('requestVideoFrameCallback' in video) {
        const onFrame = () => { frames++; emptyHintEl.style.display = 'none'; video.requestVideoFrameCallback(onFrame); };
        video.requestVideoFrameCallback(onFrame);
      }
    }

    function codecFromAnnexB(data) {
      for (let i = 0; i + 4 < data.length; i++) {
        if (data[i] === 0 && data[i + 1] === 0 && data[i + 2] === 1) {
          const nal = i + 3;
          if ((data[nal] & 0x1f) === 7 && nal + 3 < data.length) {
            const hex = b => b.toString(16).padStart(2, '0');
            return `avc1.${hex(data[nal + 1])}${hex(data[nal + 2])}${hex(data[nal + 3])}`;
          }
        }
      }
      return null;
    }

    function draw() {
      const frame = pendingFrame;
      pendingFrame = null;
      if (!frame) return;
      emptyHintEl.style.display = 'none';
      if (canvas.width !== frame.displayWidth || canvas.height !== frame.displayHeight) {
        canvas.width = frame.displayWidth;
        canvas.height = frame.displayHeight;
      }
      ctx.drawImage(frame, 0, 0);
      frame.close();
      frames++;
    }

    function createDecoder(codec) {
      decoder = new VideoDecoder({
        output(frame) {
          if (pendingFrame) { pendingFrame.close(); dropped++; }
          pendingFrame = frame;
          requestAnimationFrame(draw);
        },
        error(e) {
          lastError = 'Lỗi giải mã: ' + e.message;
          decoder = null;
          requestKeyFrame();
        },
      });
      decoder.configure({ codec, optimizeForLatency: true });
      lastError = '';
    }

    function requestKeyFrame() {
      if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify({ type: 'keyframe' }));
    }

    function handleVideo(buf) {
      bytes += buf.byteLength;
      const view = new DataView(buf);
      const flags = view.getUint8(0);
      const timestamp = Number(view.getBigInt64(1));
      const data = new Uint8Array(buf, 9);
      const key = (flags & FLAG_KEY) !== 0;

      if (MODE === 'mse') {
        if (!mse) mse = new MsePlayer(video, msg => { lastError = msg; mse.close(); mse = null; requestKeyFrame(); });
        mse.push(data, timestamp, key);
        return;
      }

      if (!decoder || decoder.state === 'closed') {
        if (!key) return;
        const codec = codecFromAnnexB(data);
        if (!codec) { lastError = 'Thiếu SPS'; return; }
        createDecoder(codec);
      }
      if (!key && decoder.decodeQueueSize > 30) { dropped++; requestKeyFrame(); return; }
      decoder.decode(new EncodedVideoChunk({ type: key ? 'key' : 'delta', timestamp, data }));
    }

    function handleText(msg) {
      if (msg.type === 'hello') {
        screenInfo = msg;
        if (msg.httpsPort && !window.isSecureContext && location.protocol === 'http:' &&
            location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
          httpsBtn.style.display = 'inline-block';
          httpsBtn.onclick = () => {
            location.href = `https://${location.hostname}:${msg.httpsPort}${location.pathname}${location.search}`;
          };
        }
        if (decoder && decoder.state !== 'closed') { decoder.close(); decoder = null; }
        if (mse) { mse.close(); mse = null; }
        renderStatus();
      } else if (msg.type === 'pong' && typeof msg.ts === 'number') {
        rttMs = Math.max(0, Date.now() - msg.ts);
      }
    }

    function connect(pin) {
      const proto = location.protocol === 'https:' ? 'wss' : 'ws';
      ws = new WebSocket(`${proto}://${location.host}/ws?pin=${encodeURIComponent(pin)}`);
      ws.binaryType = 'arraybuffer';
      ws.onopen = () => {
        setStatus(T.connectedWait, true);
        const startFrames = frames + dropped;
        setTimeout(() => {
          const noPicture = MODE === 'mse' ? video.readyState < 2 : canvas.width === 300;
          if (ws && ws.readyState === WebSocket.OPEN && noPicture && frames + dropped === startFrames) {
            emptyHintEl.style.display = 'block';
          }
        }, 2500);
      };
      ws.onmessage = e => {
        if (typeof e.data === 'string') handleText(JSON.parse(e.data));
        else handleVideo(e.data);
      };
      ws.onclose = e => {
        emptyHintEl.style.display = 'none';
        if (decoder && decoder.state !== 'closed') decoder.close();
        decoder = null;
        if (mse) { mse.close(); mse = null; }
        if (e.code === CLOSE_WRONG_PIN) {
          try { localStorage.removeItem('olyvexis.pin'); } catch (_) {}
          askPin(T.wrongPin);
          return;
        }
        setStatus(T.reconnecting(e.code), false);
        setTimeout(() => connect(pin), 1000);
      };
    }

    function askPin(message) {
      pinBox.style.display = 'flex';
      pinErrorEl.textContent = message || '';
      const form = pinBox.querySelector('form');
      form.pin.focus();
      form.onsubmit = ev => {
        ev.preventDefault();
        const pin = form.pin.value.trim();
        if (!pin) return;
        try { localStorage.setItem('olyvexis.pin', pin); } catch (_) {}
        pinBox.style.display = 'none';
        pinErrorEl.textContent = '';
        connect(pin);
      };
    }

    // Mouse & keyboard
    const kbd = document.getElementById('kbd');
    function send(obj) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); }

    function toDesktop(e) {
      const el = MODE === 'mse' ? video : canvas;
      const r = el.getBoundingClientRect();
      const W = screenInfo ? screenInfo.width : 16, H = screenInfo ? screenInfo.height : 9;
      const scale = Math.min(r.width / W, r.height / H);
      const w = W * scale, h = H * scale;
      const x = (e.clientX - r.left - (r.width - w) / 2) / w;
      const y = (e.clientY - r.top - (r.height - h) / 2) / h;
      return { x: Math.min(1, Math.max(0, x)), y: Math.min(1, Math.max(0, y)), inside: x >= 0 && x <= 1 && y >= 0 && y <= 1 };
    }

    function onPointer(type) {
      return e => {
        if (hudEl.contains(e.target) || pinBox.style.display === 'flex') return;
        const p = toDesktop(e);
        if (type === 'down') {
          if (!p.inside) return;
          kbd.focus({ preventScroll: true });
          e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId);
        }
        e.preventDefault();
        send({ t: 'm', a: type, x: p.x, y: p.y, b: e.buttons, btn: e.button });
      };
    }
    document.addEventListener('pointermove', onPointer('move'));
    document.addEventListener('pointerdown', onPointer('down'));
    document.addEventListener('pointerup', onPointer('up'));
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('wheel', e => {
      e.preventDefault();
      const p = toDesktop(e);
      const k = e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? 400 : 1;
      send({ t: 'w', x: p.x, y: p.y, dx: e.deltaX * k, dy: e.deltaY * k });
    }, { passive: false });

    const KEY_TO_CODE = {
      Meta: 'MetaLeft', OS: 'MetaLeft', Control: 'ControlLeft', Shift: 'ShiftLeft', Alt: 'AltLeft',
      Enter: 'Enter', Backspace: 'Backspace', Tab: 'Tab', Escape: 'Escape', Delete: 'Delete', ' ': 'Space',
      ArrowUp: 'ArrowUp', ArrowDown: 'ArrowDown', ArrowLeft: 'ArrowLeft', ArrowRight: 'ArrowRight',
      Home: 'Home', End: 'End', PageUp: 'PageUp', PageDown: 'PageDown', Insert: 'Insert', CapsLock: 'CapsLock',
      '-': 'Minus', '=': 'Equal', '[': 'BracketLeft', ']': 'BracketRight', '\\': 'Backslash', ';': 'Semicolon',
      "'": 'Quote', '/': 'Slash', ',': 'Comma', '.': 'Period', '`': 'Backquote',
    };
    function codeOf(e) {
      if (e.code) return e.code;
      if (KEY_TO_CODE[e.key]) return KEY_TO_CODE[e.key];
      if (/^[a-zA-Z]$/.test(e.key)) return 'Key' + e.key.toUpperCase();
      if (/^[0-9]$/.test(e.key)) return 'Digit' + e.key;
      if (/^F([1-9]|1[0-2])$/.test(e.key)) return e.key;
      return '';
    }
    function mods(e) { return (e.shiftKey ? 1 : 0) | (e.ctrlKey ? 2 : 0) | (e.altKey ? 4 : 0) | (e.metaKey ? 8 : 0); }
    const MODIFIER_CODES = ['ShiftLeft', 'ShiftRight', 'ControlLeft', 'ControlRight', 'AltLeft', 'AltRight', 'MetaLeft', 'MetaRight'];

    kbd.addEventListener('keydown', e => {
      if (e.isComposing || e.key === 'Process' || e.key === 'Dead') return;
      const nonAscii = e.key.length === 1 && e.key.charCodeAt(0) > 127;
      if (nonAscii && !e.ctrlKey && !e.metaKey) return;
      const code = codeOf(e);
      if (!code) return;
      e.preventDefault();
      send({ t: 'k', a: 'down', code, m: mods(e), r: e.repeat ? 1 : 0 });
    });
    kbd.addEventListener('keyup', e => {
      const code = codeOf(e);
      if (e.isComposing || !code) return;
      e.preventDefault();
      send({ t: 'k', a: 'up', code, m: mods(e) });
    });
    kbd.addEventListener('input', e => {
      if (e.isComposing) return;
      if (e.data) send({ t: 'txt', s: e.data });
      kbd.value = '';
    });
    kbd.addEventListener('compositionend', e => {
      if (e.data) send({ t: 'txt', s: e.data });
      kbd.value = '';
    });
    const heldModifiers = new Set();
    kbd.addEventListener('keydown', e => { const c = codeOf(e); if (MODIFIER_CODES.includes(c)) heldModifiers.add(c); }, true);
    kbd.addEventListener('keyup', e => heldModifiers.delete(codeOf(e)), true);
    window.addEventListener('blur', () => {
      heldModifiers.forEach(code => send({ t: 'k', a: 'up', code, m: 0 }));
      heldModifiers.clear();
    });

    const httpsBtn = document.getElementById('httpsBtn');

    document.getElementById('fitBtn').addEventListener('click', () => {
      const w = Math.round(window.innerWidth);
      const h = Math.round(window.innerHeight);
      send({ t: 'resize', w, h });
      kbd.focus({ preventScroll: true });
    });

    document.getElementById('toggleHud').addEventListener('click', () => {
      hudEl.classList.toggle('collapsed');
      document.getElementById('toggleHud').textContent = hudEl.classList.contains('collapsed') ? '▸' : '▾';
      kbd.focus({ preventScroll: true });
    });

    document.getElementById('fs').addEventListener('click', async () => {
      try {
        await document.documentElement.requestFullscreen();
        if (navigator.keyboard && navigator.keyboard.lock) await navigator.keyboard.lock();
      } catch (_) {}
      kbd.focus({ preventScroll: true });
    });

    let savedPin = new URLSearchParams(location.search).get('pin');
    if (!savedPin) { try { savedPin = localStorage.getItem('olyvexis.pin'); } catch (_) {} }
    if (savedPin) connect(savedPin); else askPin();
  </script>
</body>
</html>
